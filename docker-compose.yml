version: '3.8'

services:
  discogs-digs-rss:
    build: .
    container_name: discogs-digs-rss
    ports:
      - "4000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=data
      - NODE_ENV=production
      - PORT=3000
      - TZ=Europe/Oslo
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
